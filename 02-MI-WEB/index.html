<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi web</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --ink: #1c1917;
      --muted: #57534e;
      --accent: #0f766e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }

    header,
    main,
    footer {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    header {
      padding-top: 3rem;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: -0.03em;
    }

    p {
      margin: 0 0 1rem;
      color: var(--muted);
    }

    a {
      color: var(--accent);
    }

    footer {
      padding-bottom: 3rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Mi web</h1>
    <p>Página de inicio.</p>
  </header>
  <main>
    <p>Este es el archivo <code>index.html</code>. Puedes cambiar el texto, añadir secciones o enlazar más páginas desde aquí.</p>
  </main>
  <footer>
    <p>02-MI-WEB</p>
  </footer>
</body>
</html>
